<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin console — Campaign Span</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <link rel="stylesheet" href="assets/demo.css">
  <link rel="stylesheet" href="assets/admin.css">
  <script>try{var t=localStorage.getItem('cs-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body class="demo-page admin-page">
<header class="site-header">
  <div class="nav admin-nav">
    <a class="logo" href="admin.html" aria-label="Campaign Span admin home">
      <svg class="logo-mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="var(--brand)"/><rect x="7" y="9" width="18" height="3.2" rx="1.6" fill="#fff"/><rect x="7" y="14.4" width="12" height="3.2" rx="1.6" fill="#fff" opacity=".8"/><rect x="7" y="19.8" width="15" height="3.2" rx="1.6" fill="var(--accent)"/></svg>
      Campaign Span <span class="tag" style="margin-left:4px">Admin</span>
    </a>
    <div class="nav-actions">
      <a class="btn btn-ghost btn-sm" href="index.html">View site</a>
      <button class="icon-btn theme-toggle" type="button" aria-label="Switch between dark and light mode">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/></svg>
      </button>
    </div>
  </div>
</header>

<main id="main" class="app">
  <aside class="app-side" aria-label="Admin sections">
    <nav class="app-nav" aria-label="Admin">
      <a href="#overview" data-view="overview"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>Overview</a>
      <a href="#environments" data-view="environments"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="14" rx="2"/><path d="M8 21h8M12 18v3"/></svg>Demo environments</a>
      <a href="#onboarding" data-view="onboarding"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>Client onboarding</a>
      <a href="#troubleshoot" data-view="troubleshoot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg>Troubleshooting</a>
      <a href="#service" data-view="service"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Service settings</a>
    </nav>
    <div class="side-field">
      <label>Where data lives</label>
      <small>Environments are saved in this browser and travel inside their demo links. Use Export to back up or move them to another computer.</small>
    </div>
  </aside>

  <section class="app-main">
    <div class="app-top">
      <h1 id="view-title">Overview</h1>
      <div class="app-actions">
        <button class="btn btn-primary btn-sm" type="button" id="new-env">+ New environment</button>
      </div>
    </div>
    <div id="view" class="app-view"></div>
  </section>
</main>

<dialog id="env-dialog" class="wide-dialog" aria-labelledby="env-dialog-title">
  <form id="env-form" method="dialog" novalidate>
    <div class="dlg-head"><h2 id="env-dialog-title">New environment</h2><button type="button" class="icon-btn" data-close aria-label="Close">✕</button></div>
    <div class="dlg-body" id="env-form-body"></div>
    <div class="dlg-foot">
      <span class="muted" id="env-link-size" style="font-size:.8rem;align-self:center"></span>
      <span style="flex:1"></span>
      <button type="button" class="btn btn-ghost btn-sm" data-close>Cancel</button>
      <button type="submit" class="btn btn-ghost btn-sm" value="save">Save</button>
      <button type="submit" class="btn btn-primary btn-sm" value="open">Save and open</button>
    </div>
  </form>
</dialog>

<div class="toast-stack" id="toasts" aria-live="polite"></div>

<script src="assets/site.js"></script>
<script src="assets/env.js"></script>
<script src="assets/admin.js"></script>
</body>
</html>
