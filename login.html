<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the waitlist — Campaign Span</title>
  <meta name="description" content="Join the Campaign Span early-access waitlist and hear first when accounts open.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/styles.css">
  <script>try{var t=localStorage.getItem('cs-theme');if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
  <style>
    .auth-wrap { max-width: 460px; margin: 0 auto; padding: 64px 16px 40px; }
    form .btn-primary { width: 100%; }
    .hp { position: absolute; left: -10000px; width: 1px; height: 1px; overflow: hidden; }
  </style>
</head>
<body>
<header data-site-header></header>

<main id="main">
  <div class="auth-wrap">
    <span class="eyebrow" style="display:block;text-align:center">Early access</span>
    <h1 style="font-size:2rem;text-align:center">Join the waitlist</h1>
    <p class="muted center" style="margin-bottom:28px">Campaign Span accounts aren't open yet. Leave your details and we'll email you when your team can start.</p>

    <div class="card">
      <form id="waitlist" novalidate>
        <div class="field"><label for="wl-name">Full name</label><input id="wl-name" name="name" type="text" autocomplete="name" maxlength="80" required></div>
        <div class="field"><label for="wl-email">Work email</label><input id="wl-email" name="email" type="email" autocomplete="email" maxlength="254" required></div>
        <div class="field"><label for="wl-company">Company</label><input id="wl-company" name="company" type="text" autocomplete="organization" maxlength="80"></div>
        <div class="field">
          <label for="wl-dept">Your department</label>
          <select id="wl-dept" name="dept">
            <option value="">Choose a department…</option>
            <option>Production</option><option>Social media</option><option>Brand services</option><option>Sales</option><option>Marketing</option><option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="wl-size">Team size</label>
          <select id="wl-size" name="teamSize">
            <option value="">Choose a size…</option>
            <option>1–5</option><option>6–25</option><option>26–100</option><option>100+</option>
          </select>
        </div>
        <div class="hp" aria-hidden="true"><label for="wl-website">Leave this empty</label><input id="wl-website" name="website" type="text" tabindex="-1" autocomplete="off"></div>
        <button class="btn btn-primary" type="submit">Join the waitlist</button>
        <p class="muted" style="font-size:.85rem;margin:14px 0 0">We'll only use this to tell you about early access. See our <a href="privacy.html#waitlist">privacy policy</a>.</p>
      </form>

      <div id="wl-msg" class="notice" role="status" hidden></div>
    </div>

    <p class="muted center" style="margin-top:20px;font-size:.92rem">Want to look around first? <a href="demo.html">Try the demo</a>. No account needed.</p>
  </div>
</main>

<footer data-site-footer></footer>
<script src="assets/site.js"></script>
<script>
  (function () {
    var form = document.getElementById('waitlist');
    var msg = document.getElementById('wl-msg');
    var btn = form.querySelector('button[type="submit"]');
    function say(html) { msg.hidden = false; msg.innerHTML = html; }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!form.checkValidity()) { form.reportValidity(); return; }
      var data = {};
      new FormData(form).forEach(function (v, k) { data[k] = v; });
      btn.disabled = true; btn.textContent = 'Joining…'; msg.hidden = true;
      fetch('/api/waitlist', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) })
        .then(function (r) { return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok) throw new Error(d.error || 'Something went wrong.'); }); })
        .then(function () {
          form.hidden = true;
          say('<strong>You\u2019re on the list.</strong> We\u2019ll email you when accounts open. In the meantime, <a href="demo.html">explore the demo workspace</a>.');
        }, function (err) {
          btn.disabled = false; btn.textContent = 'Join the waitlist';
          var t = document.createElement('span'); t.textContent = err.message + ' ';
          say(''); msg.appendChild(t);
          var a = document.createElement('a'); a.href = 'mailto:hello@campaignspan.com'; a.textContent = 'Or email us.'; msg.appendChild(a);
        });
    });
  })();
</script>
</body>
</html>
